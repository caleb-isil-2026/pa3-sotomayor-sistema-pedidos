<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="980" height="640" fill="#fff"/>
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="700">Sistema de Pedidos — Arquitectura PA3 (módulo de consulta y supervisión)</text>

  <!-- Navegador -->
  <rect x="390" y="50" width="200" height="44" rx="8" fill="#e8f0fe" stroke="#3367d6"/>
  <text x="490" y="77" text-anchor="middle" font-weight="600">Navegador / Cliente HTTP</text>
  <line x1="490" y1="94" x2="490" y2="118" stroke="#333" marker-end="url(#a)"/>

  <!-- Security -->
  <rect x="150" y="120" width="680" height="54" rx="8" fill="#fce8e6" stroke="#c5221f"/>
  <text x="490" y="142" text-anchor="middle" font-weight="600">Spring Security (SecurityFilterChain)</text>
  <text x="490" y="162" text-anchor="middle" font-size="12">formLogin · CSRF · GET /reportes/** y /api/v1/pedidos/** → OPERADOR, CONSULTA · POST /pedidos → OPERADOR</text>
  <line x1="490" y1="174" x2="490" y2="198" stroke="#333" marker-end="url(#a)"/>

  <!-- Dispatcher -->
  <rect x="390" y="200" width="200" height="40" rx="8" fill="#f1f3f4" stroke="#5f6368"/>
  <text x="490" y="225" text-anchor="middle" font-weight="600">DispatcherServlet</text>

  <line x1="440" y1="240" x2="230" y2="276" stroke="#333" marker-end="url(#a)"/>
  <line x1="540" y1="240" x2="750" y2="276" stroke="#333" marker-end="url(#a)"/>
  <line x1="490" y1="240" x2="490" y2="276" stroke="#333" marker-end="url(#a)"/>

  <!-- Controllers -->
  <rect x="70" y="278" width="320" height="64" rx="8" fill="#e6f4ea" stroke="#137333"/>
  <text x="230" y="300" text-anchor="middle" font-weight="600">@Controller (JSP)</text>
  <text x="230" y="318" text-anchor="middle" font-size="12">PedidoController · PedidoReporteWebController</text>
  <text x="230" y="334" text-anchor="middle" font-size="12">Model → ViewResolver → reportes-pedidos.jsp</text>

  <rect x="410" y="278" width="160" height="64" rx="8" fill="#fef7e0" stroke="#b06000"/>
  <text x="490" y="304" text-anchor="middle" font-weight="600" font-size="13">ReporteApi</text>
  <text x="490" y="322" text-anchor="middle" font-weight="600" font-size="13">ExceptionHandler</text>

  <rect x="590" y="278" width="320" height="64" rx="8" fill="#e6f4ea" stroke="#137333"/>
  <text x="750" y="300" text-anchor="middle" font-weight="600">@RestController (JSON)</text>
  <text x="750" y="318" text-anchor="middle" font-size="12">PedidoReporteController · PedidoApiController</text>
  <text x="750" y="334" text-anchor="middle" font-size="12">/busqueda-avanzada · /clientes-frecuentes</text>

  <line x1="230" y1="342" x2="330" y2="388" stroke="#333" marker-end="url(#a)"/>
  <line x1="750" y1="342" x2="650" y2="388" stroke="#333" marker-end="url(#a)"/>

  <!-- Services -->
  <rect x="150" y="390" width="300" height="56" rx="8" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="300" y="413" text-anchor="middle" font-weight="600">PedidoService / Impl</text>
  <text x="300" y="432" text-anchor="middle" font-size="12">registro transaccional de pedidos</text>

  <rect x="530" y="390" width="300" height="56" rx="8" fill="#ede7f6" stroke="#5e35b1"/>
  <text x="680" y="413" text-anchor="middle" font-weight="600">PedidoReporteService / Impl</text>
  <text x="680" y="432" text-anchor="middle" font-size="12">valida cliente, totalMinimo ≥ 0, minPedidos ≥ 1</text>

  <line x1="230" y1="446" x2="200" y2="490" stroke="#333" marker-end="url(#a)"/>
  <line x1="370" y1="446" x2="420" y2="490" stroke="#333" marker-end="url(#a)"/>
  <line x1="700" y1="446" x2="720" y2="490" stroke="#333" marker-end="url(#a)"/>

  <!-- Repos / client -->
  <rect x="80" y="492" width="240" height="56" rx="8" fill="#e8f0fe" stroke="#3367d6"/>
  <text x="200" y="515" text-anchor="middle" font-weight="600">PedidoRepository</text>
  <text x="200" y="534" text-anchor="middle" font-size="12">Spring Data JPA</text>

  <rect x="340" y="492" width="200" height="56" rx="8" fill="#fef7e0" stroke="#b06000"/>
  <text x="440" y="515" text-anchor="middle" font-weight="600">InventarioRestClient</text>
  <text x="440" y="534" text-anchor="middle" font-size="12">RestClient (HTTP/JSON)</text>

  <rect x="555" y="492" width="400" height="56" rx="8" fill="#e8f0fe" stroke="#3367d6"/>
  <text x="755" y="515" text-anchor="middle" font-weight="600">PedidoReporteJdbcRepository</text>
  <text x="755" y="534" text-anchor="middle" font-size="12">Spring JDBC · NamedParameterJdbcTemplate · RowMapper</text>

  <!-- MySQL -->
  <line x1="200" y1="548" x2="400" y2="586" stroke="#333" marker-end="url(#a)"/>
  <line x1="755" y1="548" x2="520" y2="586" stroke="#333" marker-end="url(#a)"/>
  <rect x="380" y="588" width="160" height="40" rx="8" fill="#e6f4ea" stroke="#137333"/>
  <text x="460" y="613" text-anchor="middle" font-weight="600">MySQL · pedidosdb</text>

  <!-- inventario externo -->
  <path d="M440 548 L440 570 L80 570" fill="none" stroke="#b06000" stroke-dasharray="5 4"/>
  <rect x="10" y="586" width="300" height="42" rx="8" fill="#fff" stroke="#b06000" stroke-dasharray="5 4"/>
  <text x="160" y="604" text-anchor="middle" font-weight="600">inventario-service (externo)</text>
  <text x="160" y="620" text-anchor="middle" font-size="12">Jakarta EE / WildFly · :8082</text>
  <line x1="80" y1="570" x2="80" y2="584" stroke="#b06000" marker-end="url(#a)"/>
</svg>
